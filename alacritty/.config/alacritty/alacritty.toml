[window]
opacity = 0.95
dynamic_padding = true

[font]
size = 12.0

[font.normal]
family = "CaskaydiaCove Nerd Font Mono"
style = "Regular"

[font.bold]
family = "CaskaydiaCove Nerd Font Mono"
style = "Bold"

[font.italic]
family = "CaskaydiaCove Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font Mono"
style = "Bold Italic"

[font.features]
# Ligatury (jeśli font je wspiera)
"calt" = true
"liga" = true

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

import = ["tokyonight-moon.toml",]


