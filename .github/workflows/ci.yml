name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update
      - run: sudo apt-get install -y shellcheck shfmt

      - run: find . -name '*.sh' -exec shellcheck {} +
      - run: find . -name '*.sh' -exec shfmt -d {} +
