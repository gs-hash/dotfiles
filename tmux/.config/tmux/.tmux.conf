##### Enable focus events (Neovim, fzf, etc.)
set -g focus-events on

##### Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

##### Reload configuration
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

##### Number windows/panes from 1
set -g base-index 1
setw -g pane-base-index 1

##### Split windows (keep current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##### Easy closing
bind x kill-pane
bind X kill-window

##### Mouse support
set -g mouse on

##### Faster escape sequences (better Vim feel)
set -sg escape-time 0

##### True color
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

##### Start new windows/panes in the current directory
bind c new-window -c "#{pane_current_path}"

##### Pane border
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=yellow]#(basename #{pane_current_path}),}"

##### Tokyo Night status bar
set -g status-style bg=#1a1b26,fg=#c0caf5

set -g status-left-length 50
set -g status-right-length 100

set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26]"

setw -g window-status-style fg=#414868,bg=#1a1b26
setw -g window-status-current-style fg=#1a1b26,bg=#9ece6a,bold

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

set -g status-right "#[fg=#9ece6a]#(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=#414868] #[fg=#ff9e64]#(basename #{pane_current_path}) #[fg=#414868] #[fg=#bb9af7]%H:%M "

##### Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
